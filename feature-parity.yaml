# This is the backwards-compatible broad planning and verification roadmap.
# Atomic source-of-truth records live in parity/*.yaml.
# status values: prototype | planned | partial | in_progress | implemented | validated | deferred
reference_product: "Professional NLE capability baseline"
reference_version: "26.5"
updated: "2026-10-06"
status_definitions:
  prototype: "Demonstrable local UI/state behavior; not a production media implementation."
  planned: "Specified in ARCHITECTURE.md but no implementing runtime exists."
  partial: "A tested runtime component exists but does not yet meet the full acceptance criterion."
  in_progress: "Work is actively being integrated but is not ready to be called partial or implemented."
  implemented: "Working native/runtime capability with stated acceptance coverage."
  validated: "Implemented capability with its relevant compatibility, failure, and performance evidence recorded."
  deferred: "Intentionally excluded from the current delivery segment; no runtime claim is made."

# Broad roadmap IDs below are retained for existing consumers. Atomic source-of-truth
# manifests live in parity/*.yaml and are validated/aggregated by:
#   node scripts/generate-parity-report.js
# The generated premiere-parity-report.{json,md} deliberately has no weighted score.
detailed_parity:
  manifest_directory: parity/
  generator: scripts/generate-parity-report.js
  report_json: premiere-parity-report.json
  report_markdown: premiere-parity-report.md

features:
  - { id: media_bins_metadata_search, priority: P0, status: prototype, acceptance: "Bins, metadata, search, labels, markers and relink operate on durable project data." }
  - { id: import_camera_and_image_sequences, priority: P0, status: planned, acceptance: "Probe and ingest camera cards, file drops, and image sequences." }
  - { id: checksum_ingest_transcode, priority: P0, status: planned, acceptance: "Copy/link, checksum, verify and transcode media without blocking the editor." }
  - { id: proxy_workflow, priority: P1, status: implemented, implementation: "Local cancellable generation, persisted fingerprint-safe association, automatic monitor selection/fallback, originals-only export.", acceptance: "Create, attach, relink and toggle validated proxies." }
  - { id: source_monitor_three_point_editing, priority: P0, status: planned, acceptance: "Source in/out and insert/overwrite edits are frame accurate." }
  - { id: timeline_tracks, priority: P0, status: partial, implementation: "Native typed sequence and video/audio track records are persisted transactionally; no timeline UI, composition, or playback exists.", acceptance: "Create and edit practical AV track counts using durable clip/track identities." }
  - { id: insert_overwrite_lift_extract, priority: P0, status: planned, acceptance: "Each operation preserves sequence and sync invariants." }
  - { id: ripple_roll_slip_slide, priority: P0, status: planned, acceptance: "All trim modes pass deterministic timeline-invariant tests." }
  - { id: speed_reverse_hold_remap, priority: P1, status: partial, implementation: "Persisted time-remap curves with ramp, hold and reverse segments drive video and audio; SetSpeedRamp/ClearSpeedRamp edit them with split, undo and reopen; pitch-preserving audio follows a ramp. No ramp editor UI.", acceptance: "Time transforms preserve exact source/timeline mapping." }
  - { id: interpolation_optical_flow, priority: P2, status: partial, implementation: "CPU block optical flow with confidence and occlusion fallback, content-addressed analysis cache and a cancellable background analysis job; 4.9 s per 1080p pair in Release, no GPU path.", acceptance: "Frame sampling, blending and temporal optical flow are quality-policy aware." }
  - { id: waveform_timecode_sync, priority: P1, status: partial, implementation: "Native sample-position AudioClock and timestamp-based VFR lookup exist; there is no decoded audio, device output, waveform, or sync analysis yet.", acceptance: "Audio and timecode sync provide reviewed alignment results." }
  - { id: multicam, priority: P2, status: partial, implementation: "Persisted groups, angles and cuts with create/sync/switch/flatten commands, an angle-monitor mosaic and hit test; no multicam UI.", acceptance: "Multicam source and live angle switching produce editable commands." }
  - { id: nesting, priority: P1, status: planned, acceptance: "Nested sequence graph renders and conforms deterministically." }
  - { id: adjustment_layers, priority: P1, status: planned, acceptance: "Track-spanning effects compile in the render graph." }
  - { id: keyframes, priority: P1, status: planned, acceptance: "Linear, Bezier, ease and hold curves evaluate exactly." }
  - { id: gpu_effects_transitions, priority: P1, status: planned, acceptance: "Effects/transitions use portable render nodes with CPU fallback." }
  - { id: masks_tracking_stabilization, priority: P2, status: planned, acceptance: "Mask/track/stabilize artifacts are versioned and recoverable." }
  - { id: compositing_graphics_titles, priority: P1, status: planned, acceptance: "Blend, alpha, mattes, graphics and typography render consistently." }
  - { id: color_grading, priority: P1, status: prototype, acceptance: "Stored grade values are applied by a real color-managed render pipeline." }
  - { id: hdr_wide_gamut_luts_scopes, priority: P2, status: planned, acceptance: "PQ, HLG, wide gamut, LUT and scope output pass golden-frame tests." }
  - { id: audio_mixer_effects_vst3, priority: P1, status: planned, acceptance: "Sample-accurate audio graph and isolated VST3 hosting meet playback deadlines." }
  - { id: auto_duck_speech_cleanup_music_remix, priority: P2, status: planned, acceptance: "Background audio analysis returns reviewable project artifacts." }
  - { id: transcription_paper_edit, priority: P2, status: planned, acceptance: "Transcript edits become validated timeline commands." }
  - { id: captions_translation_word_styles, priority: P2, status: prototype, acceptance: "Timed captions persist; auto-caption/translation/style render/export are complete." }
  - { id: semantic_search_scene_detection, priority: P2, status: planned, acceptance: "Versioned embeddings and scene results are searchable and invalidated correctly." }
  - { id: object_masks_auto_reframe, priority: P2, status: planned, acceptance: "Vision analysis produces reviewable tracked masks/reframe commands." }
  - { id: generative_media_extension, priority: P3, status: planned, acceptance: "Provider-neutral generation is explicit, auditable and safely reversible." }
  - { id: llm_command_assistant, priority: P0, status: prototype, acceptance: "MCP exposes constrained validated commands, read-only inspection, journaling and confirmation policy." }
  - { id: h264_hevc_av1_export, priority: P0, status: prototype, acceptance: "Queue records exist; real audio/video encoded files pass playback and QC." }
  - { id: licensed_professional_formats, priority: P3, status: planned, acceptance: "Licensed provider modules negotiate supported professional codecs/formats." }
  - { id: caption_export, priority: P1, status: planned, acceptance: "Sidecar, embedded and burn-in captions conform to requested output." }
  - { id: standalone_render_queue, priority: P1, status: prototype, acceptance: "Jobs execute in an isolated render worker with progress, retry and cancellation." }
  - { id: aaf_xml_edl_otio_interchange, priority: P2, status: planned, acceptance: "Round-trips retain supported timeline fields and report loss warnings." }
  - { id: shared_projects_productions_review, priority: P3, status: planned, acceptance: "Locks, changesets, comments and conflict resolution preserve user work." }
  - { id: ofx_plugin_sdk_panels_scripting, priority: P2, status: planned, acceptance: "Sandboxed plug-in and automation hosts use scoped versioned contracts." }
  - { id: customizable_workspaces_keyboard, priority: P1, status: prototype, acceptance: "Workspace and shortcut customization persist per user/project safely." }
  - { id: multi_monitor_external_monitor, priority: P3, status: planned, acceptance: "Independent program output operates on supported display/I/O devices." }
  - { id: autosave_journal_recovery, priority: P0, status: partial, implementation: "Native SQLite WAL journal files, durable ordered revisions, configurable state snapshots, and journal validation are implemented. Automatic crash replay is not implemented; browser recovery remains prototype-only.", acceptance: "Crash recovery replays journal after a tested consistent snapshot." }
  - { id: archive_collect_consolidate, priority: P2, status: planned, acceptance: "Archive verifies copied media and reports missing/licensed assets." }
  - { id: schema_migrations, priority: P0, status: partial, implementation: "Native schema v2 validates and transactionally migrates v1 after a SQLite backup. No general migration registry or user-facing repair flow exists.", acceptance: "Versioned projects migrate transactionally with safe backup and rollback." }
  - { id: hardware_capability_scheduler, priority: P1, status: partial, implementation: "Tested deterministic P0-P9 scheduler core; no hardware/resource integration.", acceptance: "Workload selection is capability-based, measured and explainable." }
  - { id: zero_copy_gpu_surfaces, priority: P1, status: planned, acceptance: "Decode/render/encode remain on compatible GPU surfaces where possible." }
  - { id: adaptive_playback_quality, priority: P1, status: planned, acceptance: "Preview resolution/temporal quality adapts without audio deadline misses." }
  - { id: rational_time_vfr_audio_clock, priority: P0, status: partial, implementation: "JavaScript BigInt and native C++ RationalTime cores support exact arithmetic, supported frame rates, and drop-frame timecode. Native VFR timestamp maps and sample-count AudioClock are tested in isolation; no decode/device playback path exists.", acceptance: "CFR/VFR and long-form media retain A/V sync under test." }
  - { id: cache_resource_manager, priority: P1, status: planned, acceptance: "RAM, VRAM, disk cache and I/O budgets prevent instability under pressure." }
  - { id: driver_compatibility_benchmark, priority: P2, status: planned, acceptance: "Driver rules and startup benchmark choose safe hardware paths." }
  - { id: render_regression_testing, priority: P0, status: partial, implementation: "Exact-time, scheduler, and media-fingerprint tests exist; no fixture render tests.", acceptance: "Golden-frame and backend comparison gates run before release." }
