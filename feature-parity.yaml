# This is the backwards-compatible broad planning and verification roadmap.
# Atomic source-of-truth records live in parity/*.yaml.
# status values: prototype | planned | partial | in_progress | implemented | validated | deferred
reference_product: "Professional NLE capability baseline"
reference_version: "26.5"
updated: "2026-10-08"
status_definitions:
  prototype: "Demonstrable local UI/state behavior; not a production media implementation."
  planned: "Specified in ARCHITECTURE.md but no implementing runtime exists."
  partial: "A tested runtime component exists but does not yet meet the full acceptance criterion."
  in_progress: "Work is actively being integrated but is not ready to be called partial or implemented."
  implemented: "Working native/runtime capability with stated acceptance coverage."
  validated: "Implemented capability with its relevant compatibility, failure, and performance evidence recorded."
  deferred: "Intentionally excluded from the current delivery segment; no runtime claim is made."

# Broad roadmap IDs below are retained for existing consumers. Atomic source-of-truth
# manifests live in parity/*.yaml and are validated/aggregated by:
#   node scripts/generate-parity-report.js
# The generated premiere-parity-report.{json,md} deliberately has no weighted score.
detailed_parity:
  manifest_directory: parity/
  generator: scripts/generate-parity-report.js
  report_json: premiere-parity-report.json
  report_markdown: premiere-parity-report.md

features:
  - { id: media_bins_metadata_search, priority: P0, status: partial, implementation: "Bins, markers, relink and media records are persisted, undoable store commands; the application's Project panel is a flat list with proxy state and has no bin, search, label, metadata or relink interface.", acceptance: "Bins, metadata, search, labels, markers and relink operate on durable project data." }
  - { id: import_camera_and_image_sequences, priority: P0, status: planned, acceptance: "Probe and ingest camera cards, file drops, and image sequences." }
  - { id: checksum_ingest_transcode, priority: P0, status: partial, implementation: "File > Ingest Media copies with a hash of the source and of the written file and refuses a mismatch, imports, and makes a proxy as cancellable jobs. No transcode-on-ingest of the original and no checksum manifest file.", acceptance: "Copy/link, checksum, verify and transcode media without blocking the editor." }
  - { id: proxy_workflow, priority: P1, status: implemented, implementation: "Local cancellable generation, persisted fingerprint-safe association, automatic monitor selection/fallback, originals-only export.", acceptance: "Create, attach, relink and toggle validated proxies." }
  - { id: source_monitor_three_point_editing, priority: P0, status: partial, implementation: "Engine: ui::PlanInsertEdit takes a source range and ui::ResolveThreePoint resolves three-point edits (tested). Application: whole media items are placed at the playhead using sequence marks; there is no source monitor, source in/out, patching or targeting.", acceptance: "Source in/out and insert/overwrite edits are frame accurate." }
  - { id: timeline_tracks, priority: P0, status: implemented, implementation: "Typed sequence, video and audio tracks (mute, solo, lock, buses and routing) are persisted transactionally and drawn and edited in the Qt timeline.", acceptance: "Create and edit practical AV track counts using durable clip/track identities." }
  - { id: insert_overwrite_lift_extract, priority: P0, status: implemented, implementation: "ui/EditPlanner: insert, overwrite, lift, extract, ripple delete, move, split and paste as undoable plans that keep linked clips in step; the timeline and key commands drive them.", acceptance: "Each operation preserves sequence and sync invariants." }
  - { id: ripple_roll_slip_slide, priority: P0, status: implemented, implementation: "ui/EditPlanner plans ripple trim, roll, slip and slide on the timeline tools B, N, Y and U; each gesture is one undo step and refusals are shown.", acceptance: "All trim modes pass deterministic timeline-invariant tests." }
  - { id: speed_reverse_hold_remap, priority: P1, status: implemented, implementation: "Persisted time-remap curves with ramp, hold and reverse segments drive video and audio; SetSpeedRamp/ClearSpeedRamp edit them with split, undo and reopen; pitch-preserving audio follows a ramp within 0.25-4x; the speed-ramp editor (Ctrl+Alt+R) and a speed/duration dialog (Ctrl+R) are in the application. Eases are stepped.", acceptance: "Time transforms preserve exact source/timeline mapping." }
  - { id: interpolation_optical_flow, priority: P2, status: partial, implementation: "CPU block optical flow with confidence and occlusion fallback, content-addressed analysis cache and a cancellable background analysis job; 4.9 s per 1080p pair in Release, no GPU path.", acceptance: "Frame sampling, blending and temporal optical flow are quality-policy aware." }
  - { id: waveform_timecode_sync, priority: P1, status: partial, implementation: "Sample-position AudioClock, VFR timestamp maps, decoded audio, WASAPI output, multicam sync by sound, timecode or marker, and loudness metering exist. No waveform is drawn on timeline clips and there is no general sync-clips command.", acceptance: "Audio and timecode sync provide reviewed alignment results." }
  - { id: multicam, priority: P2, status: partial, implementation: "Persisted groups, angles and cuts with create/sync/switch/flatten/rename commands, an angle monitor, live cutting with digits or clicks, cut editing and flattening onto tracks (Multicam workspace). No sound while the group plays; sync tested on synthetic envelopes only.", acceptance: "Multicam source and live angle switching produce editable commands." }
  - { id: nesting, priority: P1, status: partial, implementation: "Nested sequences render, mix and conform (compiler, compositor, mixer, store cycle checks). The application never creates a second sequence or nests a selection.", acceptance: "Nested sequence graph renders and conforms deterministically." }
  - { id: adjustment_layers, priority: P1, status: partial, implementation: "Adjustment clips compile into the render graph and the CPU and Direct3D 11 compositors apply them to what lies beneath (tested). The application has no command that adds one.", acceptance: "Track-spanning effects compile in the render graph." }
  - { id: keyframes, priority: P1, status: implemented, implementation: "Hold, linear, bezier and ease curves evaluate exactly over rational time; the inspector toggles, jumps and resets keyframes and masks are keyed on the monitor.", acceptance: "Linear, Bezier, ease and hold curves evaluate exactly." }
  - { id: gpu_effects_transitions, priority: P1, status: partial, implementation: "A Direct3D 11 compositor renders layers, motion, crop, opacity, the colour tools, LUTs, dissolves, generators, adjustment clips and sequence effects on the card, tested picture by picture against the software one; filters, keys, blend modes, masks, graphics and the other 22 transitions fall back to software.", acceptance: "Effects/transitions use portable render nodes with CPU fallback." }
  - { id: masks_tracking_stabilization, priority: P2, status: partial, implementation: "Versioned rectangle, ellipse and bezier masks with a monitor editor; point and planar tracking with stored data and mask following; similarity stabilisation; rolling-shutter repair. No object selection, no perspective stabilisation, no GPU path.", acceptance: "Mask/track/stabilize artifacts are versioned and recoverable." }
  - { id: compositing_graphics_titles, priority: P1, status: partial, implementation: "12 blend modes, premultiplied alpha, a titles and graphics designer with six templates, animated entrances and typography rendered by the same path as export. No track mattes.", acceptance: "Blend, alpha, mattes, graphics and typography render consistently." }
  - { id: color_grading, priority: P1, status: partial, implementation: "Basic grade, wheels, curves, hue curves, white balance, vibrance, HSL secondary and 3D/1D LUTs run through a colour-managed pipeline (ACES and four camera log spaces; no OpenColorIO or ACES output transform) on the CPU and the card; shown as typed numeric controls, with no wheel or curve widgets.", acceptance: "Stored grade values are applied by a real color-managed render pipeline." }
  - { id: hdr_wide_gamut_luts_scopes, priority: P2, status: partial, implementation: "PQ, HLG, P3, Rec.2020, ACES, LUTs and waveform, parade, vectorscope and histogram scopes exist and are tested; no 10-bit end-to-end path, HDR monitoring or GPU scope aggregation.", acceptance: "PQ, HLG, wide gamut, LUT and scope output pass golden-frame tests." }
  - { id: audio_mixer_effects_vst3, priority: P1, status: partial, implementation: "Sample-accurate audio graph with buses, sends, automation modes, EQ, dynamics, gate, ducking, noise and reverb reduction, loudness, and a mixer and Essential Sound interface. No VST3 hosting and no plug-in delay compensation.", acceptance: "Sample-accurate audio graph and isolated VST3 hosting meet playback deadlines." }
  - { id: auto_duck_speech_cleanup_music_remix, priority: P2, status: partial, implementation: "Side-chain auto-duck, noise and reverb reduction and role presets (Essential Sound) exist; there is no music remix and no learned speech enhancement.", acceptance: "Background audio analysis returns reviewable project artifacts." }
  - { id: transcription_paper_edit, priority: P2, status: partial, implementation: "A local whisper.cpp adapter (not bundled) makes word-timed transcripts that map onto the timeline; words can be deleted, fillers and pauses removed, captions made, all as undoable commands. No semantic search or translation.", acceptance: "Transcript edits become validated timeline commands." }
  - { id: captions_translation_word_styles, priority: P2, status: partial, implementation: "Caption tracks and cues are project data with undo, track styling, SRT and WebVTT import/export and burn-in; no translation, per-cue styles or timeline lane.", acceptance: "Timed captions persist; auto-caption/translation/style render/export are complete." }
  - { id: semantic_search_scene_detection, priority: P2, status: planned, acceptance: "Versioned embeddings and scene results are searchable and invalidated correctly." }
  - { id: object_masks_auto_reframe, priority: P2, status: planned, acceptance: "Vision analysis produces reviewable tracked masks/reframe commands." }
  - { id: generative_media_extension, priority: P3, status: planned, acceptance: "Provider-neutral generation is explicit, auditable and safely reversible." }
  - { id: llm_command_assistant, priority: P0, status: prototype, acceptance: "MCP exposes constrained validated commands, read-only inspection, journaling and confirmation policy." }
  - { id: h264_hevc_av1_export, priority: P0, status: implemented, implementation: "21 presets (H.264, HEVC 8/10-bit, AV1, VP9, MPEG-2 MXF, ProRes, DNxHR, FFV1, audio only) resolved to encoders that work on the machine, AMD AMF hardware encode verified, finished files checked by reading them back.", acceptance: "Queue records exist; real audio/video encoded files pass playback and QC." }
  - { id: licensed_professional_formats, priority: P3, status: planned, acceptance: "Licensed provider modules negotiate supported professional codecs/formats." }
  - { id: caption_export, priority: P1, status: partial, implementation: "SubRip and WebVTT sidecars and compositor burn-in; no embedded caption delivery.", acceptance: "Sidecar, embedded and burn-in captions conform to requested output." }
  - { id: standalone_render_queue, priority: P1, status: partial, implementation: "A persistent export queue with pause, cancel, retry and reorder runs jobs one at a time on its own thread inside the application; there is no isolated render process.", acceptance: "Jobs execute in an isolated render worker with progress, retry and cancellation." }
  - { id: aaf_xml_edl_otio_interchange, priority: P2, status: partial, implementation: "OpenTimelineIO, CMX 3600 EDL and Final Cut 7 XML read and write with round-trip tests and loss reports (engine only: no menu in the application). AAF and OMF do not exist.", acceptance: "Round-trips retain supported timeline fields and report loss warnings." }
  - { id: shared_projects_productions_review, priority: P3, status: planned, acceptance: "Locks, changesets, comments and conflict resolution preserve user work." }
  - { id: ofx_plugin_sdk_panels_scripting, priority: P2, status: planned, acceptance: "Sandboxed plug-in and automation hosts use scoped versioned contracts." }
  - { id: customizable_workspaces_keyboard, priority: P1, status: implemented, implementation: "Docking, eight saved workspaces, a shortcut editor with conflict detection and atomic preferences persist per user and survive a restart.", acceptance: "Workspace and shortcut customization persist per user/project safely." }
  - { id: multi_monitor_external_monitor, priority: P3, status: planned, acceptance: "Independent program output operates on supported display/I/O devices." }
  - { id: autosave_journal_recovery, priority: P0, status: partial, implementation: "Journal v2, interval snapshots, replay to the last good revision and quarantine are implemented and tested; the application does not call recovery on open and undo history does not survive it.", acceptance: "Crash recovery replays journal after a tested consistent snapshot." }
  - { id: archive_collect_consolidate, priority: P2, status: partial, implementation: "core/project/Consolidate collects, hashes, verifies and relinks the media a project uses (engine only: no menu in the application); no trim with handles or transcode.", acceptance: "Archive verifies copied media and reports missing/licensed assets." }
  - { id: schema_migrations, priority: P0, status: partial, implementation: "Schema v13 with a transactional migration chain from older versions and refusal of newer ones, tested; no user-facing repair flow.", acceptance: "Versioned projects migrate transactionally with safe backup and rollback." }
  - { id: hardware_capability_scheduler, priority: P1, status: partial, implementation: "A bounded priority scheduler and a capability-based GPU selector (AMD, NVIDIA, Intel and Apple descriptors tested) exist; the scheduler is not yet what decode, presenter, proxy and export run on.", acceptance: "Workload selection is capability-based, measured and explainable." }
  - { id: zero_copy_gpu_surfaces, priority: P1, status: partial, implementation: "Direct3D 11 video acceleration decodes onto the compositor's device and the compositor reads the planes in place; the finished picture is read back for the monitor and encode is not on GPU surfaces.", acceptance: "Decode/render/encode remain on compatible GPU surfaces where possible." }
  - { id: adaptive_playback_quality, priority: P1, status: partial, implementation: "The monitor renders at full, half, quarter, eighth or an automatic size for its window and an offline policy chooses proxy presets; nothing adapts automatically to missed deadlines.", acceptance: "Preview resolution/temporal quality adapts without audio deadline misses." }
  - { id: rational_time_vfr_audio_clock, priority: P0, status: implemented, implementation: "Native RationalTime with drop-frame timecode and an integer tick timebase, VFR timestamp maps, a sample-counting AudioClock that drives the transport, and WASAPI output are implemented and tested.", acceptance: "CFR/VFR and long-form media retain A/V sync under test." }
  - { id: cache_resource_manager, priority: P1, status: partial, implementation: "A shared RAM/disk/VRAM quota with pressure levels coordinates render-frame and optical-flow entries; decoded frames, thumbnails and GPU surfaces are not enrolled and no OS pressure signal is read.", acceptance: "RAM, VRAM, disk cache and I/O budgets prevent instability under pressure." }
  - { id: driver_compatibility_benchmark, priority: P2, status: planned, acceptance: "Driver rules and startup benchmark choose safe hardware paths." }
  - { id: render_regression_testing, priority: P0, status: partial, implementation: "Four golden frames with difference maps, GPU-against-CPU picture comparison, decode round trips and 756 native tests exist; no CI gate and no performance-regression gate.", acceptance: "Golden-frame and backend comparison gates run before release." }
